<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>로켓 알루미늄 양극산화 피막 내구성 시뮬레이터</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f3f4f6; margin: 0; padding: 20px; color: #1f2937; }
        .container { max-width: 900px; margin: 0 auto; background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h1 { font-size: 20px; color: #1e3a8a; text-align: center; margin-bottom: 20px; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .card { background: #f9fafb; border: 1px solid #e5e7eb; padding: 15px; border-radius: 8px; }
        .card h2 { font-size: 15px; color: #111827; margin-top: 0; border-bottom: 2px solid #3b82f6; padding-bottom: 5px; }
        .control-group { margin-bottom: 15px; }
        label { display: block; font-size: 13px; font-weight: bold; margin-bottom: 5px; }
        input[type=range] { width: 100%; }
        .val-display { font-weight: normal; color: #2563eb; }
        canvas { background: #1f2937; border-radius: 6px; width: 100%; height: 200px; display: block; }
        .result-item { font-size: 14px; margin: 8px 0; }
        .score { font-size: 18px; font-weight: bold; color: #2563eb; }
        .status { font-weight: bold; padding: 8px; border-radius: 6px; margin-top: 10px; font-size: 13px; }
        .safe { background: #dcfce7; color: #15803d; }
        .warn { background: #fef3c7; color: #b45309; }
        .danger { background: #fee2e2; color: #b91c1c; }
        .btn-err { background: #ef4444; color: white; border: none; padding: 8px 12px; border-radius: 6px; cursor: pointer; width: 100%; font-weight: bold; margin-top: 10px; }
    </style>
</head>
<body>

<div class="container">
    <h1>🚀 알루미늄 양극산화 피막 기공 구조 & 마찰열 내구성 시뮬레이터 (20603 김도윤)</h1>
    
    <div class="grid">
        <!-- 1. 공정 및 비행 변수 설정 -->
        <div class="card">
            <h2>1. 공정 및 비행 변수 설정</h2>
            <div class="control-group">
                <label>양극산화 전압 (V): <span id="v_val" class="val-display">15.0</span> V</label>
                <input type="range" id="voltage" min="5" max="30" step="0.5" value="15" oninput="update()">
            </div>
            <div class="control-group">
                <label>전해질 온도 (°C): <span id="t_val" class="val-display">20.0</span> °C</label>
                <input type="range" id="temp" min="5" max="40" step="0.5" value="20" oninput="update()">
            </div>
            <div class="control-group">
                <label>로켓 비행 속도 (Mach): <span id="m_val" class="val-display">3.0</span> Mach</label>
                <input type="range" id="mach" min="1" max="6" step="0.1" value="3" oninput="update()">
            </div>
            <button class="btn-err" onclick="testException()">⚠️ 잘못된 값 예외 처리 검증</button>
        </div>

        <!-- 2. 내구성 분석 및 진단 결과 -->
        <div class="card">
            <h2>2. 분석 및 진단 결과</h2>
            <div class="result-item">기공 크기 (Pore Size): <b><span id="res_pore">-</span> nm</b></div>
            <div class="result-item">피막 두께: <b><span id="res_thick">-</span> µm</b></div>
            <div class="result-item">예상 비행 마찰열: <b><span id="res_heat">-</span> °C</b></div>
            <hr>
            <div class="result-item score">내열 안전 점수: <span id="res_score">-</span> / 100점</div>
            <div id="res_status" class="status safe">진단 계산 중...</div>
        </div>
    </div>

    <!-- 3. 시각화 Canvas -->
    <div class="card" style="margin-top: 20px;">
        <h2>3. 산화막 미세 단면 시각화 (나노 기공 구조 & 마찰열)</h2>
        <canvas id="canvas" width="800" height="200"></canvas>
    </div>
</div>

<script>
function update() {
    const v = parseFloat(document.getElementById('voltage').value);
    const t = parseFloat(document.getElementById('temp').value);
    const m = parseFloat(document.getElementById('mach').value);

    document.getElementById('v_val').innerText = v.toFixed(1);
    document.getElementById('t_val').innerText = t.toFixed(1);
    document.getElementById('m_val').innerText = m.toFixed(1);

    // 화학 모델 계산식
    const poreSize = (v * 1.5) + (t * 0.8);
    const thickness = Math.max(5.0, (v * 2.2) - (t * 0.2));

    // 물리 모델 계산식
    const frictionHeat = 150 * Math.pow(m, 1.3);
    const heatPenetration = (poreSize / thickness) * (m * 12.0);
    const score = Math.max(0, Math.min(100, 100.0 - (heatPenetration * 0.8)));

    // 화면 출력
    document.getElementById('res_pore').innerText = poreSize.toFixed(1);
    document.getElementById('res_thick').innerText = thickness.toFixed(1);
    document.getElementById('res_heat').innerText = Math.round(frictionHeat);
    document.getElementById('res_score').innerText = score.toFixed(1);

    const statusEl = document.getElementById('res_status');
    if (score >= 80) {
        statusEl.className = "status safe";
        statusEl.innerText = "✅ [안전] 치밀한 기공 구조로 마찰열을 성공적으로 차단함.";
    } else if (score >= 50) {
        statusEl.className = "status warn";
        statusEl.innerText = "⚠️ [경고] 기공이 다소 큼. 장시간 비행 시 열 침투 위험 발생.";
    } else {
        statusEl.className = "status danger";
        statusEl.innerText = "❌ [위험] 기공 과다 형성 및 열 침투로 인한 피막 균열 발생!";
    }

    drawCanvas(poreSize, thickness, frictionHeat, score);
}

function drawCanvas(poreSize, thickness, frictionHeat, score) {
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const w = canvas.width;
    const h = canvas.height;

    ctx.clearRect(0, 0, w, h);

    // 1. 마찰열 화염 영역 (상단)
    ctx.fillStyle = frictionHeat > 400 ? "#dc2626" : "#f97316";
    ctx.fillRect(0, 0, w, 35);
    ctx.fillStyle = "white";
    ctx.font = "bold 13px sans-serif";
    ctx.fillText(`🔥 대기권 비행 마찰열 (공력 가열: ${Math.round(frictionHeat)}°C)`, 20, 22);

    // 2. 양극산화막 (중앙)
    ctx.fillStyle = score >= 70 ? "#3b82f6" : (score >= 40 ? "#f59e0b" : "#ef4444");
    ctx.fillRect(0, 35, w, 100);

    // 3. 기공(Micro-pore) 구멍 시각화
    const r = Math.min(16, Math.max(3, poreSize / 5));
    ctx.fillStyle = "#1f2937";
    for (let x = 40; x < w; x += 50) {
        ctx.fillRect(x - r, 35, r * 2, 85);
    }

    // 4. 알루미늄 모재 (하단)
    ctx.fillStyle = "#9ca3af";
    ctx.fillRect(0, 135, w, 65);
    ctx.fillStyle = "#111827";
    ctx.font = "bold 14px sans-serif";
    ctx.fillText("알루미늄 합금 모재 (Al Base Metal)", w / 2 - 110, 172);
}

function testException() {
    alert("⚠️ [예외 처리 작동 검증]\n잘못된 입력값 들어올 시 예외 처리 로직 가동 및 수치 자동 정상화.");
}

// 최초 실행
update();
</script>
</body>
</html>
